<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PropSnap Dashboard</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main id="app">
    <header class="header">
      <div class="title">
        <h1>PropSnap</h1>
        <span class="subtitle">Saved listings</span>
      </div>
      <div class="actions">
        <button id="planBtn" class="btn btn-primary">Viewing planner</button>
        <button id="lettersBtn" class="btn" disabled title="Tick homes to write to their owners">Letters</button>
        <button id="exportBtn" class="btn">Export CSV</button>
        <button id="clearBtn" class="btn btn-danger">Clear all</button>
      </div>
    </header>

    <section class="summary" aria-label="Summary">
      <div class="stat"><span id="statTotal" class="stat-value">0</span><span class="stat-label">Saved</span></div>
      <div class="stat"><span id="statExact" class="stat-value">0</span><span class="stat-label">Exact match</span></div>
      <div class="stat"><span id="statChosen" class="stat-value">0</span><span class="stat-label">Your choice</span></div>
      <div class="stat"><span id="statGuess" class="stat-value">0</span><span class="stat-label">Best guess</span></div>
      <div class="stat"><span id="statNone" class="stat-value">0</span><span class="stat-label">No full address</span></div>
      <div class="stat"><span id="statReduced" class="stat-value">0</span><span class="stat-label">Price reduced</span></div>
      <div class="stat"><span id="statActive" class="stat-value">0</span><span class="stat-label">Active deals</span></div>
      <div class="stat"><span id="statDue" class="stat-value">0</span><span class="stat-label">Follow-ups due</span></div>
    </section>

    <section class="toolbar" aria-label="Filters">
      <input id="search" type="search" placeholder="Search address, postcode, agent, labels or notes" aria-label="Search" />
      <select id="sourceFilter" aria-label="Site">
        <option value="all">All sites</option>
        <option value="rightmove">Rightmove</option>
        <option value="zoopla">Zoopla</option>
        <option value="openrent">OpenRent</option>
      </select>
      <select id="matchFilter" aria-label="Match">
        <option value="all">All matches</option>
        <option value="exact">Exact match</option>
        <option value="user_choice">Your choice</option>
        <option value="best_guess">Best guess</option>
        <option value="none">No full address</option>
      </select>
      <select id="priceFilter" aria-label="Price change">
        <option value="all">All prices</option>
        <option value="reduced">Price reduced</option>
        <option value="increased">Price increased</option>
        <option value="changed">Any price change</option>
      </select>
      <select id="daysFilter" aria-label="Days on the market">
        <option value="0">Any time on the market</option>
        <option value="30">On the market 30+ days</option>
        <option value="60">On the market 60+ days</option>
        <option value="90">On the market 90+ days</option>
        <option value="180">On the market 180+ days</option>
      </select>
      <select id="areaFilter" aria-label="Area checks">
        <option value="all">Any area</option>
        <option value="no-hmo-article4">No HMO Article 4</option>
        <option value="no-flood">Not in a flood zone</option>
        <option value="no-conservation">Not in a conservation area</option>
        <option value="flagged">Has an area warning</option>
      </select>
      <select id="statusFilter" aria-label="Stage">
        <option value="all">All stages</option>
        <option value="active">Active deals</option>
        <option value="due">Follow-ups due</option>
      </select>
      <select id="labelFilter" aria-label="Label">
        <option value="all">All labels</option>
      </select>
      <select id="hiddenFilter" aria-label="Hidden homes">
        <option value="hide">Leave out hidden homes</option>
        <option value="show">Show hidden homes too</option>
        <option value="only">Only hidden homes</option>
      </select>
      <label class="group-toggle"><input type="checkbox" id="groupByAgent" /> Group by agent</label>
      <span id="shownCount" class="shown"></span>
    </section>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th><span class="sr-only">Pick for viewings</span></th>
            <th><button data-sort="capturedAt">Captured</button></th>
            <th><button data-sort="source">Site</button></th>
            <th><button data-sort="address">Address</button></th>
            <th><button data-sort="postcode">Postcode</button></th>
            <th class="num"><button data-sort="price">Price</button></th>
            <th class="num"><button data-sort="bedrooms">Beds</button></th>
            <th><button data-sort="propertyType">Type</button></th>
            <th><button data-sort="epcRating">EPC</button></th>
            <th><button data-sort="agentName">Agent</button></th>
            <th><button data-sort="status">Stage</button></th>
            <th><span class="sr-only">Actions</span></th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>

    <p id="empty" class="empty" hidden></p>
    <p id="status" class="status" role="status"></p>
  </main>

  <script type="module" src="./main.ts"></script>
</body>
</html>
